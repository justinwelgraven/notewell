# Builds and publishes Notewell for Mac (Apple Silicon + Intel) and Windows on every push to main.
# Each run becomes a GitHub release "v0.1.<run number>"; the desktop apps find it through
# latest.json and offer "Restart to update". (The web version is published by web.yml to GitHub Pages.)
#
# Needs one repository secret (Settings → Secrets and variables → Actions):
#   TAURI_SIGNING_PRIVATE_KEY = contents of ~/.tauri/notewell.key on the Windows PC
name: Release Notewell

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "web/**", "release/**"]
  workflow_dispatch:

permissions:
  contents: write # create releases

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Commits marked "[web only]" just update the web version (web.yml) — no new desktop release.
    if: ${{ !contains(github.event.head_commit.message, '[web only]') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: windows-latest
            args: ""
            rust_targets: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Set version 0.1.${{ github.run_number }}
        run: node scripts/set-version.mjs 0.1.${{ github.run_number }}

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: v__VERSION__
          releaseName: Notewell v__VERSION__
          releaseBody: "Automatic build from ${{ github.sha }}. Installed apps update themselves."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}
