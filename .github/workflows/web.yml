# Publishes the web version (iPhone) to GitHub Pages on every push to main:
#   https://justinwelgraven.github.io/notewell/
# One-time setup: repository Settings → Pages → Source: "GitHub Actions" (done).
# To re-publish without code changes: Actions tab → "Publish web version" → Run workflow.
name: Publish web version

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "release/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run build:web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
