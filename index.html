<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale=1: iOS zooms in when a field with text under 16px gets focus (note text is 15px on
         iPhone) and can keep a zoom after rotating. iOS still allows pinch-zoom for accessibility. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="theme-color" content="#1a1a1a" />
    <!-- iPhone home-screen app -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Edge to edge (Apple's guidance for full-screen web apps): the app draws under the status bar and
         keeps its content inside the safe areas (env(safe-area-inset-*) in styles.css). A solid "black"
         bar made the iPhone Duo report no status-bar inset, so the top of the app sat under the icons. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Notewell" />
    <link rel="apple-touch-icon" sizes="180x180" href="./src/assets/apple-touch-icon.png?no-inline" />
    <link rel="icon" type="image/png" href="icons/favicon-32.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <title>Notewell</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
